name: Bug report
description: Report a reproducible problem in DeepMox.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing Issues first. This report is public.
        Remove passwords, API tokens, cookies, private keys, IP addresses, hostnames, and other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      placeholder: Describe the problem briefly.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: DeepMox version and build
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model (optional)
      description: Do not include serial numbers or hardware identifiers.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Connection / authentication
        - Nodes / cluster
        - Virtual machines (VM)
        - Containers (LXC)
        - Terminal / console
        - Storage
        - Backup / restore
        - Monitoring / performance
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error message
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics (optional)
      description: Paste only a reviewed excerpt. Never include secrets or private host details.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or recording link (optional)
      description: Redact hostnames, IP addresses, usernames, and other private details.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Issues for duplicates.
          required: true
        - label: I understand this Issue and its attachments are public.
          required: true
        - label: I removed credentials, tokens, cookies, private keys, and sensitive information.
          required: true
