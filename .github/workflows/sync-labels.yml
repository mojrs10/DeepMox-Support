name: Sync issue labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-labels.yml"

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update support labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["bug", "d73a4a", "A reproducible defect"],
              ["enhancement", "a2eeef", "A proposed feature or improvement"],
              ["ui-ux", "c5def5", "Usability or visual feedback"],
              ["question", "d876e3", "A usage question"],
              ["proxmox", "0052cc", "Proxmox integration"],
              ["virtual-machines", "1d76db", "Virtual machine functionality"],
              ["containers", "5319e7", "LXC container functionality"],
              ["terminal", "0e8a16", "Terminal or console"],
              ["storage", "006b75", "Storage functionality"],
              ["backup-restore", "fbca04", "Backup and restore"],
              ["performance", "f9d0c4", "Performance or resource usage"],
              ["connection", "c2e0c6", "Network or authentication"],
              ["security", "b60205", "Security-related; do not publish vulnerability details"],
              ["needs-triage", "ededed", "Awaiting maintainer review"],
              ["duplicate", "cfd3d7", "Duplicate report"],
              ["needs-info", "fbca04", "More information requested"],
              ["accepted", "0e8a16", "Accepted for consideration"],
              ["planned", "bfdadc", "Planned; not a delivery guarantee"],
              ["in-progress", "0052cc", "Implementation underway"],
              ["testing", "5319e7", "Awaiting validation"],
              ["fixed", "0e8a16", "Fix is available"],
              ["wontfix", "ffffff", "Will not be implemented"],
              ["priority-critical", "b60205", "Critical priority"],
              ["priority-high", "d93f0b", "High priority"],
              ["priority-medium", "fbca04", "Medium priority"],
              ["priority-low", "c5def5", "Low priority"]
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name, color, description
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name, new_name: name, color, description
                });
              }
            }
