name: UI / UX feedback
description: Report usability, layout, accessibility, or visual-design feedback.
title: "[UI/UX]: "
body:
  - type: markdown
    attributes:
      value: |
        Screenshots and descriptions are public. Redact server names, IP addresses, usernames, and other private information.
  - type: input
    id: app_version
    attributes:
      label: DeepMox version and build
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and screen type (optional)
      placeholder: Phone / tablet / TV and model
    validations:
      required: false
  - type: textarea
    id: location
    attributes:
      label: Screen or workflow
      description: Where does this occur?
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What is confusing or could be improved?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
    validations:
      required: false
  - type: textarea
    id: visual
    attributes:
      label: Screenshot or mockup link (optional)
      description: Redact private information before sharing.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I understand this feedback is public and have removed sensitive information.
          required: true
